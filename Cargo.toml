[package]
name = "atuin-web-manage"
version = "0.1.0"
edition = "2021"
description = "Local web UI to manage (search, edit, bulk-delete) atuin shell history"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ctxinf/atuin-web-manage"
readme = "README.md"

[workspace]

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["homebrew"]
tap = "ctxinf/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
pr-run-mode = "plan"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
